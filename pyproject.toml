[project]
name = "check_run"
description = "Payables utility for ERPNext"
authors = [
    { name = "AgriTheory", email = "support@agritheory.dev" }
]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies", "version"]

[project.urls]
homepage = "https://github.com/agritheory/check_run"
repository = "https://github.com/agritheory/check_run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "15.0.0"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
atnacha = { git = "https://github.com/AgriTheory/atnacha.git" }
pdfplumber = "^0.11.6"

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
pytest-order = "^1.2.1"

[tool.pytest.ini_options]
addopts = "--cov=check_run --cov-report term-missing"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
hrms = ">=15.0.0,<16.0.0"

[tool.bench.dev-dependencies]
pytest = "~=8.2.2"
pytest-cov = "~=5.0.0"
pytest-order = "~=1.2.1"

[tool.black]
line-length = 99

[tool.codespell]
skip = "yarn.lock,CHANGELOG.md"

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.coverage.report]
skip_covered = true
skip_empty = true
omit = [
    "*/boot.py",
    "*/customize.py",
    "*/hooks.py",
    "*/install.py",
    "*/patches/*",
    "*/test_*.py",
    "*/tests/*",
]
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
build_command = "echo 1"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variable = ["check_run/__init__.py:__version__"]

[tool.semantic_release.branches.version]
match = "version-15"
