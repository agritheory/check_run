name: Print Format Diff

on:
  pull_request:
    branches:
      - version-14
      - version-15
    paths:
      - 'print_format/**/*.json'

jobs:
  diff_print_format:
    runs-on: ubuntu-latest
    name: Print Format Diff
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Print Format Diff
        uses: agritheory/test_utils/actions/diff_print_format@multiple_actions
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}